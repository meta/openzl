# The compression playground's Electron desktop app, set up and tested on Linux,
# macOS and Windows the same way a developer would: `yarn install`, `yarn
# setup`, `yarn test`. That is the typecheck, lint and unit tests of the app and
# of the web playground it shows, then the smoke tests: native zli and
# zstd-benchmark, the window's security settings, cancellation, and the
# packaged app. Anything a platform needs belongs in setup.cjs or the test
# scripts, not here.

name: desktop-playground

on:
  push:
    branches: [dev]
    paths:
      - 'tools/web/compression_playground/**'
      - 'tools/desktop/compression_playground/**'
      - 'tools/web/package.json'
      - 'tools/web/yarn.lock'
      # The renderer's shared components and the workspace's build config.
      - 'tools/web/web_common/**'
      - 'tools/web/tsconfig*.json'
      - 'tools/web/vite.base.ts'
      - 'tools/web/eslint.config.js'
      - 'tools/web/.prettierrc'
      # The app drives zli: its arguments, its CSV and the candidates
      # `zli train` writes are the interface the desktop backend reads.
      - 'cli/**'
      - 'tools/training/**'
      # The sample the app bundles, which the smoke test trains on.
      - 'examples/getting_started/sample_inputs/sra0.bin'
      - '.github/workflows/desktop-playground-ci.yml'
  pull_request:
    branches: [dev, master, actionsTest]
    paths:
      - 'tools/web/compression_playground/**'
      - 'tools/desktop/compression_playground/**'
      - 'tools/web/package.json'
      - 'tools/web/yarn.lock'
      # The renderer's shared components and the workspace's build config.
      - 'tools/web/web_common/**'
      - 'tools/web/tsconfig*.json'
      - 'tools/web/vite.base.ts'
      - 'tools/web/eslint.config.js'
      - 'tools/web/.prettierrc'
      - 'cli/**'
      - 'tools/training/**'
      - 'examples/getting_started/sample_inputs/sra0.bin'
      - '.github/workflows/desktop-playground-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Bumping Emscripten means editing this and the matching lines in
# test-deploy-docs.yml, deploy-docs.yml and wasm-ci.yml.
env:
  EMSDK_VERSION: 4.0.19

jobs:
  # Synced with the "wasm" job in test-deploy-docs.yml, cache key included, so
  # a build either workflow made is restored here. The desktop app never loads
  # the module, but the renderer cannot be bundled without it.
  wasm:
    name: Build WASM artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache WASM artifact
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: build-wasm/tools/wasm
          key: >-
            openzl-wasm-${{runner.os}}-emsdk${{env.EMSDK_VERSION}}-${{hashFiles(
            'tools/wasm/**', 'tools/training/**', 'tools/io/**',
            'tools/logger/**', 'cli/utils/profile_graphs.*',
            'custom_parsers/**', 'cpp/**', 'src/**', 'include/**',
            '**/CMakeLists.txt', 'build-scripts/cmake/**',
            '.github/workflows/deploy-docs.yml',
            '.github/workflows/test-deploy-docs.yml')}}
      - name: Set up Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{env.EMSDK_VERSION}}
          actions-cache-folder: emsdk-cache
      - name: Configure
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: emcmake cmake -DOPENZL_BUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release -B build-wasm
      - name: Build
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cmake --build build-wasm --target openzl_wasm -j$(getconf _NPROCESSORS_ONLN)
      - name: Strip debug info
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: emstrip --strip-debug build-wasm/tools/wasm/openzl.wasm
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: openzl-wasm
          path: |
            build-wasm/tools/wasm/openzl.js
            build-wasm/tools/wasm/openzl.wasm
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: wasm
    runs-on: ${{ matrix.os }}
    # Training the bundled sample dominates: about 7 minutes on a devserver
    # with 4 training threads, longer on a hosted runner.
    timeout-minutes: 90
    # On every platform the app ships for: paths, line endings and process
    # handling differ, and only running there shows it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: tools/desktop/compression_playground
    steps:
      # Windows checks files out with CRLF line endings, which Prettier rejects.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: |
            tools/web/yarn.lock
            tools/desktop/compression_playground/yarn.lock
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: openzl-wasm
          path: tools/wasm/js
      - run: yarn install --frozen-lockfile
      - run: yarn setup
      - run: yarn test
